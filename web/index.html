<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NewsAnalyzer · 新聞可靠度分析</title>
<style>
  :root {
    --bg-0: #0b0f1a;
    --bg-1: #111827;
    --card: rgba(255,255,255,0.05);
    --card-solid: #161c2e;
    --card-border: rgba(255,255,255,0.12);
    --text: #e5e7eb;
    --text-dim: #9ca3af;
    --accent: #6366f1;
    --accent-2: #8b5cf6;
    --green: #34d399;
    --yellow: #fbbf24;
    --red: #f87171;
    --radius: 18px;
    --shadow: 0 20px 60px rgba(0,0,0,0.45);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", "Noto Sans CJK TC", sans-serif;
    background-color: var(--bg-0);
    background-image: radial-gradient(1200px 800px at 80% -10%, #1e1b4b 0%, transparent 60%),
                      radial-gradient(1000px 700px at -10% 110%, #0f172a 0%, transparent 55%),
                      linear-gradient(160deg, var(--bg-0), var(--bg-1));
    background-attachment: fixed;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px 60px;
  }

  /* ---------- Header ---------- */
  .header { text-align:center; margin-bottom: 36px; max-width:720px; width:100%; }
  .logo {
    display:inline-flex; align-items:center; gap:12px;
    font-size: 26px; font-weight:800; letter-spacing:0.5px;
    color:#c4b5fd;
  }
  .logo .badge {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color:#fff;
    font-size:11px; font-weight:700; padding:3px 10px; border-radius:20px;
    letter-spacing:1px;
    margin-left:4px;
  }
  .subtitle { color:var(--text-dim); margin-top:10px; font-size:15px; line-height:1.5; }

  /* ---------- Card ---------- */
  .card {
    width:100%; max-width:720px;
    background-color: var(--card-solid);
    background-image: linear-gradient(160deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
    border:1px solid var(--card-border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 28px;
    margin-bottom: 24px;
  }

  /* ---------- Input ---------- */
  .input-wrap { width:100%; }
  .input-wrap textarea {
    width:100%; min-height:120px; resize:vertical;
    background-color: rgba(0,0,0,0.4);
    border:1px solid var(--card-border);
    border-radius:12px;
    color:var(--text);
    font-size:15px; line-height:1.7;
    padding:16px;
    font-family:inherit;
    display:block;
    transition: border-color .2s, box-shadow .2s;
  }
  .input-wrap textarea:focus {
    outline:none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(99,102,241,0.2);
  }
  .input-wrap textarea::placeholder { color:#6b7280; }

  .actions { display:flex; gap:12px; margin-top:16px; flex-wrap:wrap; }
  .btn {
    flex:1 1 140px;
    min-width:140px;
    padding:14px 20px;
    border:none; border-radius:12px;
    font-size:15px; font-weight:700; cursor:pointer;
    font-family:inherit;
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    transition: transform .15s, box-shadow .2s, opacity .2s;
  }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity:0.5; cursor:not-allowed; }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color:#fff; box-shadow: 0 8px 24px rgba(99,102,241,0.35);
  }
  .btn-primary:hover:not(:disabled) { box-shadow: 0 10px 30px rgba(99,102,241,0.5); }
  .btn-ghost {
    background-color: rgba(255,255,255,0.08);
    color:var(--text); border:1px solid var(--card-border);
  }
  .btn-ghost:hover:not(:disabled) { background-color: rgba(255,255,255,0.14); }

  .spinner {
    width:16px;height:16px;border:2px solid rgba(255,255,255,0.3);
    border-top-color:#fff; border-radius:50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Result ---------- */
  .result { display:none; }
  .result.show { display:block; animation: fadeUp .5s ease; }
  @keyframes fadeUp { from { opacity:0; transform: translateY(16px);} to {opacity:1; transform:none;} }

  .result-head {
    display:flex; align-items:center; gap:24px; flex-wrap:wrap;
    padding-bottom:22px; border-bottom:1px solid var(--card-border);
  }
  .gauge-wrap { position:relative; width:150px; height:150px; flex-shrink:0; }
  /* The SVG carries an explicit width/height attribute, so shrinking the wrapper
     alone left the ring 30px wider than its box on phones — it visibly spilled
     to the right of its centred container. width/height:100% + viewBox makes it
     scale with the wrapper. */
  .gauge-wrap svg { transform: rotate(-90deg); display:block; width:100%; height:100%; }
  .gauge-bg { fill:none; stroke:rgba(255,255,255,0.08); stroke-width:12; }
  .gauge-fg {
    fill:none; stroke-width:12; stroke-linecap:round;
    transition: stroke-dashoffset 1s cubic-bezier(.22,1,.36,1), stroke .5s;
  }
  .gauge-center {
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
  }
  .gauge-score { font-size:38px; font-weight:800; line-height:1; }
  .gauge-score small { font-size:16px; font-weight:600; color:var(--text-dim); }
  .gauge-label { font-size:12px; color:var(--text-dim); margin-top:4px; }

  .result-info { flex:1 1 220px; min-width:220px; }
  .rating-badge {
    display:inline-block; padding:6px 16px; border-radius:20px;
    font-size:15px; font-weight:800; letter-spacing:0.5px;
  }
  .rating-good { background:rgba(52,211,153,0.15); color:var(--green); border:1px solid rgba(52,211,153,0.3); }
  .rating-mid   { background:rgba(251,191,36,0.15); color:var(--yellow); border:1px solid rgba(251,191,36,0.3); }
  .rating-bad   { background:rgba(248,113,113,0.15); color:var(--red); border:1px solid rgba(248,113,113,0.3); }
  .rating-warn  { background:rgba(251,146,60,0.15); color:#fb923c; border:1px solid rgba(251,146,60,0.3); }
  .rating-caution { background:rgba(56,189,248,0.15); color:#38bdf8; border:1px solid rgba(56,189,248,0.3); }
  .rating-mid2  { background:rgba(251,191,36,0.15); color:var(--yellow); border:1px solid rgba(251,191,36,0.3); }
  .rating-good2 { background:rgba(45,212,191,0.15); color:#2dd4bf; border:1px solid rgba(45,212,191,0.3); }
  .result-title { margin-top:12px; font-size:16px; font-weight:600; line-height:1.5; word-break:break-word; }
  .result-url {
    margin-top:6px; font-size:12px; color:var(--text-dim);
    word-break:break-all;
  }
  .result-url a { color:var(--accent); text-decoration:none; }
  .result-url a:hover { text-decoration:underline; }

  /* ---------- Metrics ---------- */
  .metrics { margin-top:22px; display:grid; gap:16px; }
  .metric { width:100%; }
  .metric-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; gap:10px; }
  .metric-name { font-size:13px; font-weight:600; color:var(--text-dim); display:flex; align-items:center; gap:8px; }
  .metric-name .icon { font-size:15px; }
  .metric-val { font-size:13px; font-weight:700; flex-shrink:0; }
  .bar { height:8px; border-radius:6px; background:rgba(255,255,255,0.07); overflow:hidden; width:100%; }
  .bar-fill {
    height:100%; border-radius:6px; width:0%;
    transition: width 1s cubic-bezier(.22,1,.36,1);
  }
  .metric-desc { margin-top:5px; font-size:11px; color:#6b7280; word-break:break-word; }

  /* ---------- Fact-check sources block ---------- */
  .sources { margin-top:22px; border-top:1px solid var(--card-border); padding-top:18px; }
  .sources-title { font-size:13px; font-weight:700; color:var(--text-dim); margin-bottom:12px; display:flex; align-items:center; gap:8px; }
  .source-item { display:flex; gap:12px; align-items:flex-start; padding:10px 0; border-bottom:1px solid rgba(255,255,255,0.05); }
  .source-item:last-child { border-bottom:none; }
  .source-badge { flex-shrink:0; font-size:11px; font-weight:700; padding:3px 10px; border-radius:8px; background:rgba(255,255,255,0.08); color:var(--text-dim); }
  .source-badge.hit { background:rgba(248,113,113,0.18); color:var(--red); }
  .source-badge.ok  { background:rgba(52,211,153,0.18); color:var(--green); }
  .source-body { flex:1; min-width:0; }
  .source-name { font-size:13px; font-weight:600; }

  /* ---------- Deep Analysis block (local LLM) ---------- */
  .deep-analysis { margin-top:22px; border-top:1px solid var(--card-border); padding-top:18px; }
  .deep-title { font-size:13px; font-weight:700; color:var(--text-dim); margin-bottom:12px; display:flex; align-items:center; gap:8px; }
  .deep-score-row { display:flex; align-items:center; gap:12px; margin-bottom:14px; }
  .deep-score-badge { font-size:22px; font-weight:800; padding:6px 14px; border-radius:12px; background:rgba(255,255,255,0.07); min-width:64px; text-align:center; }
  .deep-score-bar { flex:1; height:8px; border-radius:6px; background:rgba(255,255,255,0.07); overflow:hidden; }
  .deep-score-bar > div { height:100%; border-radius:6px; transition:width 1s cubic-bezier(.22,1,.36,1); }
  .deep-section-label { font-size:12px; font-weight:700; color:var(--text-dim); margin:12px 0 6px; }
  .deep-key-points { list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:6px; }
  .deep-key-points li { font-size:12.5px; padding:7px 10px; background:rgba(255,255,255,0.04); border-left:3px solid var(--accent); border-radius:6px; }
  .deep-viewpoints, .deep-analysis-text { font-size:12.5px; line-height:1.6; color:var(--text); background:rgba(255,255,255,0.04); padding:10px 12px; border-radius:8px; }
  .deep-basis { margin-top:12px; font-size:12px; line-height:1.5; color:var(--text-dim); background:rgba(56,189,248,0.07); border-left:3px solid rgba(56,189,248,0.4); padding:8px 12px; border-radius:0 8px 8px 0; }
  .deep-model { font-size:10px; color:#6b7280; margin-top:10px; }
  .deep-claim { font-size:13.5px; color:#c7d2fe; background:rgba(99,102,241,0.12); border:1px solid rgba(99,102,241,0.35); border-radius:8px; padding:8px 11px; margin-top:10px; line-height:1.6; }
  .deep-provisional { font-size:13px; color:#fcd34d; background:rgba(251,191,36,0.10); border:1px solid rgba(251,191,36,0.40); border-radius:8px; padding:8px 11px; margin-top:10px; line-height:1.6; }
  .deep-evidence-used { font-size:11.5px; color:#94a3b8; margin-top:8px; line-height:1.6; }
  .source-reason { font-size:12px; color:var(--text-dim); margin-top:3px; line-height:1.5; word-break:break-word; }
  .source-link { font-size:12px; color:var(--accent); text-decoration:none; word-break:break-all; display:inline-block; margin-top:3px; }
  .source-link:hover { text-decoration:underline; }

  /* ---------- Pipeline / Formula ---------- */
  .pipeline-wrap { display:flex; flex-direction:column; gap:12px; font-size:13px; margin-top:6px; }
  .pipeline-card { background:rgba(255,255,255,0.03); border:1px solid var(--card-border); border-radius:12px; padding:14px 16px; }
  .pipeline-step-title { font-weight:700; color:#c4b5fd; margin-bottom:8px; display:flex; align-items:center; justify-content:space-between; }
  .pipeline-table { width:100%; border-collapse:collapse; margin-top:6px; font-size:12.5px; }
  .pipeline-table th { text-align:left; color:var(--text-dim); padding:6px 8px; border-bottom:1px solid rgba(255,255,255,0.1); }
  .pipeline-table td { padding:6px 8px; border-bottom:1px solid rgba(255,255,255,0.05); }
  .pipeline-formula { font-family:monospace; background:rgba(0,0,0,0.3); padding:10px 12px; border-radius:8px; border-left:3px solid var(--accent); margin-top:8px; color:#e2e8f0; line-height:1.6; word-break:break-all; }
  .pipeline-badge { font-size:11px; padding:2px 8px; border-radius:12px; font-weight:700; }
  .badge-clamp { background:rgba(239,68,68,0.2); color:#fca5a5; border:1px solid rgba(239,68,68,0.4); }
  .badge-normal { background:rgba(99,102,241,0.2); color:#c7d2fe; }

  /* 網路評論搜尋連結 */
  .review-links { display:flex; gap:10px; flex-wrap:wrap; margin-top:4px; }
  .review-btn {
    display:inline-flex; align-items:center; gap:6px;
    padding:8px 14px; border-radius:10px; font-size:13px; font-weight:600;
    text-decoration:none; color:var(--text);
    background:rgba(255,255,255,0.08); border:1px solid var(--card-border);
    transition: background .2s, transform .15s;
  }
  .review-btn:hover { background:rgba(255,255,255,0.16); transform:translateY(-1px); }
  .review-btn .ic { font-size:15px; }

  /* ---------- Web results (real search) ---------- */
  .web-results { list-style:none; margin:6px 0 0; padding:0; display:flex; flex-direction:column; gap:10px; }
  .web-result {
    background:rgba(255,255,255,0.04); border:1px solid var(--card-border);
    border-radius:12px; padding:12px 14px; transition:background .2s, border-color .2s;
  }
  .web-result:hover { background:rgba(255,255,255,0.07); border-color:rgba(99,102,241,0.4); }
  .web-title { display:block; font-size:14px; font-weight:600; color:#c4b5fd; text-decoration:none; line-height:1.5; }
  .web-title:hover { text-decoration:underline; }
  .web-meta { display:flex; gap:8px; align-items:center; margin-top:6px; flex-wrap:wrap; }
  .web-src { font-size:11px; font-weight:700; color:#a5b4fc; background:rgba(99,102,241,0.15); padding:2px 8px; border-radius:20px; }
  .web-url { font-size:11px; color:var(--text-dim); word-break:break-all; }
  .web-snip { margin:6px 0 0; font-size:12.5px; color:var(--text-dim); line-height:1.6; }

  /* ---------- Error ---------- */
  .error {
    display:none; margin-top:16px; padding:14px 16px;
    background:rgba(248,113,113,0.1); border:1px solid rgba(248,113,113,0.3);
    border-radius:12px; color:var(--red); font-size:14px;
  }
  .error.show { display:block; animation: fadeUp .3s ease; }

  /* ---------- Footer ---------- */
  .footer { margin-top:auto; padding-top:40px; color:#4b5563; font-size:12px; text-align:center; max-width:720px; width:100%; }

  /* ---------- Model Picker ---------- */
  .model-picker {
    margin-top: 18px; padding-top: 16px;
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  .model-picker-head {
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; margin-bottom:12px; flex-wrap:wrap;
  }
  .model-picker-title { font-size:14px; font-weight:700; color:var(--text); }
  .model-hint { font-size:12px; color:var(--text-dim); }
  .model-hint.consensus { color:var(--accent-2); font-weight:600; }
  .model-groups { display:flex; flex-direction:column; gap:10px; }
  .model-group-label {
    font-size:11px; font-weight:700; letter-spacing:0.5px;
    color:var(--text-dim); text-transform:uppercase; margin-bottom:6px;
  }
  .model-chips { display:flex; flex-wrap:wrap; gap:8px; }
  .model-chip {
    display:inline-flex; align-items:center; gap:7px;
    padding:7px 12px; border-radius:999px; cursor:pointer;
    background:rgba(255,255,255,0.05);
    border:1px solid var(--card-border);
    color:var(--text-dim); font-size:12.5px;
    transition:all .16s ease; user-select:none;
  }
  .model-chip:hover { background:rgba(255,255,255,0.1); color:var(--text); }
  .model-chip input { display:none; }
  .model-chip .dot {
    width:8px; height:8px; border-radius:50%;
    background:var(--text-dim); flex-shrink:0; transition:background .16s;
  }
  .model-chip.checked {
    background:linear-gradient(135deg, rgba(99,102,241,.28), rgba(139,92,246,.28));
    border-color:var(--accent); color:#fff;
  }
  .model-chip.checked .dot { background:var(--accent-2); }
  .model-chip.disabled { opacity:.38; cursor:not-allowed; }
  .model-chip.disabled:hover { background:rgba(255,255,255,0.05); color:var(--text-dim); }

  /* ---------- Debug 模式（2026-10-05）：模型選擇＋耗時只在登入後露出 ---------- */
  .debug-bar {
    display:flex; gap:8px; align-items:center; margin-top:14px;
    padding:10px 12px; border:1px dashed rgba(255,255,255,0.18);
    border-radius:8px; font-size:12.5px; color:var(--text-dim);
  }
  .debug-bar input {
    flex:1; min-width:0; background:rgba(255,255,255,0.06); color:var(--text);
    border:1px solid rgba(255,255,255,0.15); border-radius:6px;
    padding:6px 8px; font-size:12.5px;
  }
  .debug-bar button {
    background:rgba(255,255,255,0.08); color:var(--text);
    border:1px solid rgba(255,255,255,0.15); border-radius:6px;
    padding:6px 12px; font-size:12.5px; cursor:pointer; white-space:nowrap;
  }
  .debug-bar button:hover { background:rgba(255,255,255,0.14); }
  .debug-bar .ok { color:var(--green); font-weight:700; }
  .debug-bar .err { color:var(--red); }
  .timings-table { width:100%; border-collapse:collapse; font-size:12.5px; }
  .timings-table td { padding:5px 4px; border-bottom:1px solid rgba(255,255,255,0.07); }
  .timings-table td:last-child { text-align:right; font-variant-numeric:tabular-nums; }
  .timings-bar { height:5px; border-radius:3px; background:var(--accent-2); margin-top:3px; }

  /* ---------- Debug 日誌（2026-10-06） ---------- */
  .debug-logs { margin-top:10px; background:rgba(0,0,0,0.35); border:1px solid rgba(255,255,255,0.12);
                border-radius:8px; padding:8px 10px; }
  .debug-logs-head { display:flex; align-items:center; gap:8px; font-size:12.5px; color:#cbd5e1; }
  .debug-logs-head button { margin-left:auto; background:rgba(255,255,255,0.08);
                border:1px solid rgba(255,255,255,0.15); border-radius:5px; color:#cbd5e1;
                cursor:pointer; font-size:11.5px; padding:3px 8px; }
  .debug-logs-head button:hover { background:rgba(255,255,255,0.14); }
  .debug-logs pre { margin:8px 0 0; max-height:260px; overflow:auto; font-size:11.5px;
                line-height:1.45; white-space:pre-wrap; word-break:break-all; color:#a7b3c4; }

  /* ---------- Responsive ---------- */
  @media (max-width: 560px) {
    body { padding:24px 14px 40px; }
    .card { padding:20px; }
    .result-head { gap:16px; }
    .gauge-wrap { width:120px; height:120px; margin:0 auto; }
    .result-info { text-align:center; }
    .btn { flex:1 1 100%; min-width:100%; }
  }
  .lang-switch-wrap {
    display: flex; justify-content: flex-end; gap: 6px;
    width: 100%; max-width: 720px; margin-bottom: 12px;
  }
  .lang-btn {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--card-border);
    border-radius: 8px; color: var(--text-dim);
    font-size: 12px; font-weight: 500; padding: 4px 10px;
    cursor: pointer; transition: all 0.2s;
  }
  .lang-btn:hover { color: #fff; background: rgba(255, 255, 255, 0.12); }
  .lang-btn.active {
    color: #fff; background: var(--accent);
    border-color: var(--accent); font-weight: 700;
  }
</style>
</head>
<body>

  <div class="lang-switch-wrap">
    <button class="lang-btn" data-lang-btn="zh">繁體中文</button>
    <button class="lang-btn" data-lang-btn="en">English</button>
    <button class="lang-btn" data-lang-btn="ja">日本語</button>
  </div>

  <div class="header">
    <div class="logo">
      <span>🛡️ NewsAnalyzer</span><span class="badge" data-i18n="badge">AI 可靠度分析</span>
    </div>
    <div class="subtitle" data-i18n="subtitle">貼上 Facebook 貼文或新聞連結，立即分析內容可靠度</div>
  </div>

  <div class="card">
    <div class="input-wrap">
      <textarea id="input" data-i18n-ph="input_placeholder" placeholder="貼上新聞連結或 Facebook 貼文內容…&#10;&#10;例如：https://www.ettoday.net/news/20240826/1234.htm&#10;或直接貼上貼文文字內容"></textarea>
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="analyzeBtn" data-i18n="analyze_btn">🔍 開始分析</button>
      <input type="file" id="mediaUploadInput" accept="image/*,video/*" style="display:none;">
      <button class="btn btn-ghost" id="uploadMediaBtn" type="button" data-i18n="upload_btn">📷/🎬 上傳圖片或影片</button>
      <button class="btn btn-ghost" id="clearBtn" data-i18n="clear_btn">🗑️ 清除</button>
    </div>
    <div id="mediaStatus" style="display:none; margin-top:8px; font-size:13px; color:#a5b4fc; background:rgba(99,102,241,0.1); border:1px solid rgba(99,102,241,0.25); border-radius:6px; padding:6px 10px;"></div>

let currentLang = 'zh';
let lastAnalysisData = null;

function setLanguage(lang) {
  if (!I18N[lang]) lang = 'zh';
  currentLang = lang;
  localStorage.setItem('na_lang', lang);
  document.documentElement.lang = lang === 'zh' ? 'zh-Hant' : (lang === 'ja' ? 'ja' : 'en');

  document.querySelectorAll('[data-lang-btn]').forEach(btn => {
    btn.classList.toggle('active', btn.getAttribute('data-lang-btn') === lang);
  });

  const dict = I18N[lang];
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (dict[key]) el.textContent = dict[key];
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => {
    const key = el.getAttribute('data-i18n-ph');
    if (dict[key]) el.placeholder = dict[key];
  });

  const badge = $('ratingBadge');
  if (badge && badge.dataset.rawRating) {
    badge.textContent = (dict.ratings && dict.ratings[badge.dataset.rawRating]) || badge.dataset.rawRating;
  }

  if (lastAnalysisData) {
    renderResult(lastAnalysisData);
  }
}

function detectInitialLang() {
  const saved = localStorage.getItem('na_lang');
  if (saved && I18N[saved]) return saved;
  const navLang = (navigator.language || navigator.userLanguage || '').toLowerCase();
  if (navLang.startsWith('ja')) return 'ja';
  if (navLang.startsWith('zh')) return 'zh';
  return 'en';
}

document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('[data-lang-btn]').forEach(btn => {
    btn.addEventListener('click', () => setLanguage(btn.getAttribute('data-lang-btn')));
  });
  setLanguage(detectInitialLang());
});

const uploadMediaBtn = $('uploadMediaBtn');
const mediaUploadInput = $('mediaUploadInput');
const mediaStatus = $('mediaStatus');

uploadMediaBtn.addEventListener('click', () => mediaUploadInput.click());

mediaUploadInput.addEventListener('change', async (e) => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;

  const isVideo = file.type.startsWith('video') || /\.(mp4|mov|mkv|avi|webm)$/i.test(file.name);
  mediaStatus.innerHTML = `⏳ 正在分析${isVideo ? '影片（語音轉錄＋畫面辨識）' : '圖片（OCR 文字萃取）'}，請稍候…`;
  mediaStatus.style.display = 'block';
  uploadMediaBtn.disabled = true;

  const fd = new FormData();
  fd.append('file', file);

  try {
    const resp = await fetch('/extract_media', { method: 'POST', body: fd });
    const res = await resp.json();
    if (!resp.ok || !res.ok) {
      showError(res.error || '媒體解析失敗');
      mediaStatus.style.display = 'none';
      uploadMediaBtn.disabled = false;
      return;
    }
    mediaStatus.innerHTML = `✅ 已成功從${res.media_type === 'video' ? '影片' : '圖片'}萃取內容，正在啟動可靠度分析…`;
    input.value = res.text;
    uploadMediaBtn.disabled = false;
    setTimeout(() => {
      mediaStatus.style.display = 'none';
      analyze();
    }, 600);
  } catch (err) {
    showError('上傳或解析媒體時發生錯誤: ' + err.message);
    mediaStatus.style.display = 'none';
    uploadMediaBtn.disabled = false;
  } finally {
    mediaUploadInput.value = '';
  }
});

let debugLogTimer = null, debugLogsPaused = false, debugLogLineCount = 0;
async function fetchDebugLogs() {
  if (!debugToken || debugLogsPaused) return;
  try {
    const r = await fetch('/debug_logs', { headers: debugHeaders({}) });
    if (!r.ok) return;
    const d = await r.json();
    const lines = d.lines || [];
    // 內容沒變就不動 DOM，避免每次輪詢都把捲動位置拉走
    if (lines.length === debugLogLineCount) return;
    debugLogLineCount = lines.length;
    const pre = $('debugLogText');
    const atBottom = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 40;
    pre.textContent = lines.length ? lines.join('\n') : '（尚無日誌）';
    if (atBottom) pre.scrollTop = pre.scrollHeight;
    $('debugLogsCount').textContent = lines.length + ' 行';
  } catch (e) { /* 輪詢失敗就等下一輪 */ }
}
function startDebugLogs() {
  stopDebugLogs();
  debugLogsPaused = false;
  $('debugLogsPauseBtn').textContent = '暫停';
  fetchDebugLogs();
  debugLogTimer = setInterval(fetchDebugLogs, 1500);
}
function stopDebugLogs() {
  if (debugLogTimer) { clearInterval(debugLogTimer); debugLogTimer = null; }
}
$('debugLogsPauseBtn').addEventListener('click', () => {
  debugLogsPaused = !debugLogsPaused;

/* ---------- 模型選擇 ---------- */
const modelGroups = $('modelGroups');
const modelHint = $('modelHint');

function renderModelPicker(models) {
  modelGroups.innerHTML = '';
  // 依 backend 分組，順序沿用後端註冊表（llm_registry.BACKENDS 的定義順序）
  const byBackend = new Map();
  for (const m of models) {
    if (!byBackend.has(m.backend)) byBackend.set(m.backend, []);
    byBackend.get(m.backend).push(m);
  }
  for (const [backend, items] of byBackend) {
    const group = document.createElement('div');
    group.innerHTML = `<div class="model-group-label">${items[0].label.split(' — ')[0]}</div>`;
    const chips = document.createElement('div');
    chips.className = 'model-chips';
    for (const m of items) {
      const chip = document.createElement('label');
      chip.className = 'model-chip';
      // 只灰掉「探測過且失敗」的。probe_ok 為 undefined = 沒測過（例如 agy 系列，
      // 當時 shim 沒起就不在 model_probe.json 裡），不代表不能用，讓使用者自己試。
      const dead = m.probe_ok === false;
      if (dead) chip.classList.add('disabled');
      chip.innerHTML =
        `<input type="checkbox" value="${m.id}"${dead ? ' disabled' : ''}>` +
        `<span class="dot"></span>${m.model}` +
        (m.local ? ' 🖥' : '') + (m.free && !m.local ? ' 🆓' : '') +
        (m.probe_ok === undefined ? ' <span style="opacity:.6">未測</span>' : '');
      chip.title = dead
        ? `上次探測失敗：${m.probe_note || '無詳情'}`
        : m.label;
      chip.addEventListener('click', e => {
        if (dead) { e.preventDefault(); return; }
        // 讓 label 的 checkbox 換狀態後再更新樣式
        setTimeout(updateModelHint, 0);
      });
      chips.appendChild(chip);
    }
    group.appendChild(chips);
    modelGroups.appendChild(group);
  }
  // 預設勾選：本機模型（最快、免費）＋ 一個雲端模型
  const preset = ['local/qwen3.8-27b-fastmtp'];
  for (const cb of modelGroups.querySelectorAll('input')) {
    if (preset.includes(cb.value)) { cb.checked = true; cb.closest('.model-chip').classList.add('checked'); }
  }
  updateModelHint();
}

function updateModelHint() {
  const n = modelGroups.querySelectorAll('input:checked').length;
  if (n === 0) { modelHint.textContent = '未勾選 → 使用系統預設'; modelHint.classList.remove('consensus'); }
  else if (n === 1) { modelHint.textContent = '已選 1 個模型'; modelHint.classList.remove('consensus'); }
  else { modelHint.textContent = `已選 ${n} 個模型 → 共識投票（分歧時不給分）`; modelHint.classList.add('consensus'); }
}

modelGroups.addEventListener('change', e => {
  if (e.target.type === 'checkbox') {
    e.target.closest('.model-chip').classList.toggle('checked', e.target.checked);
    updateModelHint();
  }
});

async function loadModels() {
  try {
    const r = await fetch('/models', { headers: debugHeaders({}) });
    if (r.status === 403) {  // token 失效（伺服器重啟過）→ 回到未登入
      debugToken = ''; sessionStorage.removeItem('na_debug_token');
      setDebug(false); return;
    }
    const d = await r.json();
    renderModelPicker(d.models || []);
  } catch (err) {
    modelHint.textContent = '模型清單載入失敗（將使用系統預設）';
  }
}
if (debugToken) { setDebug(true); loadModels(); }  // 沿用上次登入的 token

async function analyze() {
  const text = input.value.trim();
  if (!text) { showError('請先貼上新聞連結或貼文內容'); return; }

  const picked = [...document.querySelectorAll('.model-chip input:checked')]
                  .map(i => i.value);

  setLoading(true);
  hideError();
  resultCard.classList.remove('show');

  const payload = /^https?:\/\/\S+$/i.test(text)
    ? { url: text }
    : { postText: text };
  payload.lang = currentLang;
  // 勾 2+ 個 → 後端走多模型共識投票；勾 1 個或 0 個 → 沿用預設行為
  // 2026-10-05：只在 debug 模式送模型選擇
  if (debugToken && picked.length) payload.llm_models = picked;

  try {
    const res = await fetch('/judge', {
      method: 'POST',
      headers: debugHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (!res.ok) { showError(data.error || '分析失敗，請稍後再試'); return; }
    renderResult(data);
  } catch (err) {
    showError('無法連線到分析伺服器：' + err.message);
  } finally {
    setLoading(false);
  }
}

function setLoading(on) {
  const dict = I18N[currentLang] || I18N.zh;
  analyzeBtn.disabled = on;
  analyzeBtn.innerHTML = on
    ? `<span class="spinner"></span> ${dict.analyzing || '分析中…'}`
    : (dict.analyze_btn || '🔍 開始分析');
}

function showError(msg) { errorBox.textContent = msg; errorBox.classList.add('show'); }
function hideError() { errorBox.classList.remove('show'); }

function renderResult(data) {
  lastAnalysisData = data;
  const score = Math.round(data.final_score);
  const rating = data.rating_text;
  const dict = I18N[currentLang] || I18N.zh;
  const dt = dict.dim_titles || I18N.zh.dim_titles;
  const mn = dict.metric_names || I18N.zh.metric_names;
  const pt = dict.pipe || I18N.zh.pipe;

  // 分數環
  const CIRC = 414.69;
  const fg = $('gaugeFg');
  const offset = CIRC - (score / 100) * CIRC;
  fg.style.strokeDashoffset = offset;

  // 顏色依 5 級評級（PolitiFact-style 序數標籤）
  let color, badgeCls;
  if (score >= 75)      { color = '#34d399'; badgeCls = 'rating-good'; }
  else if (score >= 55) { color = '#2dd4bf'; badgeCls = 'rating-good2'; }
  else if (score >= 35) { color = '#fbbf24'; badgeCls = 'rating-mid2'; }
  else if (score >= 15) { color = '#fb923c'; badgeCls = 'rating-warn'; }
  else                  { color = '#f87171'; badgeCls = 'rating-bad'; }
  fg.style.stroke = color;

  // 數字動畫
  animateNumber($('scoreNum'), score);

  // 等級徽章
  const badge = $('ratingBadge');
  badge.dataset.rawRating = rating;
  badge.textContent = (dict.ratings && dict.ratings[rating]) || rating;
  badge.className = 'rating-badge ' + badgeCls;

  // 標題與網址
  $('resultTitle').textContent = data.title || '（無標題）';
  const restoredTitleEl = $('restoredTitle');
  const daObj = data.deep_analysis || {};
  if (daObj.title_bait) {
    const neutralTitle = daObj.neutral_title || daObj.claim || '';
    if (neutralTitle) {
      restoredTitleEl.innerHTML = `
        <div style="margin: 8px 0 10px 0; padding: 10px 13px; background: rgba(245, 158, 11, 0.12); border: 1px solid rgba(245, 158, 11, 0.35); border-radius: 8px; font-size: 13.5px; color: #fbbf24; line-height: 1.5;">
          <div style="font-weight: 700; margin-bottom: 3px; display: flex; align-items: center; gap: 6px;">
            <span>${dict.bait_title}</span>
          </div>
          <div style="color: #fef3c7;"><b>${dict.bait_label}</b>${escapeHtml(neutralTitle)}</div>
          ${daObj.title_bait_reason ? `<div style="font-size: 12px; color: rgba(254, 243, 199, 0.7); margin-top: 3px;">${dict.bait_reason_pfx}${escapeHtml(daObj.title_bait_reason)}</div>` : ''}
        </div>
      `;
      restoredTitleEl.style.display = 'block';
    } else {
      restoredTitleEl.style.display = 'none';
    }
  } else {
    restoredTitleEl.style.display = 'none';
  }
  const urlEl = $('resultUrl');
  if (data.url && data.url !== 'https://unknown') {
    urlEl.innerHTML = '🔗 <a href="' + data.url + '" target="_blank" rel="noopener">' + data.url + '</a>';
  } else {
    urlEl.innerHTML = '';
  }

  // 四維度正交契約渲染（若後端提供 data.dimensions 則優先渲染四正交維度，否則向下相容舊 6 分項）
  const dimensions = data.dimensions || null;
  const metrics = data.metrics || {};
  const defs = {
    sentiment:     { name: mn.sentiment,     icon: '😊', max: 15 },
    domain:        { name: mn.domain,        icon: '🏛️', max: 25 },
    similarity:    { name: mn.similarity,    icon: '📊', max: 15 },
    fact_check:    { name: mn.fact_check,    icon: '✅', max: 30 },
    user_feedback: { name: mn.user_feedback, icon: '👥', max: 10 },
    timeliness:    { name: mn.timeliness,    icon: '⏱️', max: 5 },
  };
  // 無資料的 desc 視為 N/A（不顯示 0% 誤導使用者）
  const NA_DESCS = new Set(['none', 'unknown', 'not_found', 'not_checked', 'disabled', '—', '']);
  const mEl = $('metrics');
  mEl.innerHTML = '';
  for (const [key, def] of Object.entries(defs)) {
    const m = metrics[key] || { score: 0, desc: '—', weight: def.max };
    const isNA = (m.score === 0 || m.score == null) && NA_DESCS.has(String(m.desc));
    const pct = isNA ? 0 : Math.max(0, Math.min(100, (m.score / def.max) * 100));
    const barColor = pct >= 70 ? 'var(--green)' : pct >= 40 ? 'var(--yellow)' : 'var(--red)';
    const row = document.createElement('div');
    row.className = 'metric';
    const valText = isNA ? 'N/A' : pct.toFixed(0) + '%';
    const valColor = isNA ? '#94a3b8' : barColor;
    const descText = isNA ? '查無資料' : (m.desc || '—');
    row.innerHTML = `
      <div class="metric-top">
        <span class="metric-name"><span class="icon">${def.icon}</span> ${def.name}</span>
        <span class="metric-val" style="color:${valColor}">${valText}</span>
      </div>
      <div class="bar"><div class="bar-fill" style="background:${valColor}"></div></div>
      <div class="metric-desc">${descText}</div>
    `;
    mEl.appendChild(row);
    // 觸發寬度動畫
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        row.querySelector('.bar-fill').style.width = (isNA ? 0 : pct) + '%';
      });
    });
  }

  // 若有四正交維度 (data.dimensions)，覆寫 mEl 為具備「我在量什麼／錯了會怎樣」契約的四維度卡片
  if (dimensions && Object.keys(dimensions).length === 4) {
    mEl.innerHTML = '';
    const dimOrder = [
      ['evidence_verdict', '✅', dt.evidence_verdict],
      ['source_corroboration', '🏛️', dt.source_corroboration],
      ['headline_faithfulness', '🎯', dt.headline_faithfulness],
      ['rhetorical_risk', '🛡️', dt.rhetorical_risk],
    ];
    for (const [dKey, icon, titleText] of dimOrder) {
      const d = dimensions[dKey];
      if (!d) continue;
      let pct = 50, valText = '', barColor = 'var(--yellow)';
      if (dKey === 'evidence_verdict') {
        if (d.status_label === 'supports') { pct = Math.round(d.confidence * 100); valText = (currentLang === 'en' ? `True (${pct}%)` : (currentLang === 'ja' ? `真実 (${pct}%)` : `屬實 (信心 ${pct}%)`)); barColor = 'var(--green)'; }
        else if (d.status_label === 'refutes') { pct = Math.round(d.confidence * 100); valText = (currentLang === 'en' ? `False (${pct}%)` : (currentLang === 'ja' ? `虚偽 (${pct}%)` : `不實 (信心 ${pct}%)`)); barColor = 'var(--red)'; }
        else if (d.status_label === 'partially_refutes') { pct = 50; valText = (currentLang === 'en' ? 'Partially False' : (currentLang === 'ja' ? '一部虚偽' : '部分不實')); barColor = 'var(--yellow)'; }
        else if (d.status_label === 'unrelated') { pct = 0; valText = (currentLang === 'en' ? 'Unrelated' : (currentLang === 'ja' ? '無関係' : '無關已剔除')); barColor = '#94a3b8'; }
        else { pct = 0; valText = (currentLang === 'en' ? 'No Records' : (currentLang === 'ja' ? '記録なし' : '無查核紀錄')); barColor = '#94a3b8'; }
      } else if (dKey === 'source_corroboration') {
        pct = Math.round(d.value * 100);
        const tag = d.status_label === 'corroborated' ? (currentLang === 'en' ? 'Corroborated' : currentLang === 'ja' ? '裏付けあり' : '跨源佐證') : (d.status_label === 'blocked' ? (currentLang === 'en' ? 'Blocklist' : currentLang === 'ja' ? 'ブラックリスト' : '黑名單') : (currentLang === 'en' ? 'Single Source' : currentLang === 'ja' ? '単一情報源' : '單一/未佐證'));
        valText = `${pct}% (${tag})`;
        barColor = pct >= 60 ? 'var(--green)' : (d.status_label === 'blocked' ? 'var(--red)' : 'var(--yellow)');
      } else if (dKey === 'headline_faithfulness') {
        pct = Math.round(d.value * 100);
        valText = d.impact_pts < 0 ? (currentLang === 'en' ? `-${Math.abs(d.impact_pts)} pts` : (currentLang === 'ja' ? `減点 ${d.impact_pts}` : `扣分 ${d.impact_pts} 分`)) : (currentLang === 'en' ? 'Faithful (0)' : (currentLang === 'ja' ? '整合 (0)' : '忠實 (0 扣分)'));
        barColor = d.impact_pts < 0 ? 'var(--red)' : 'var(--green)';
      } else if (dKey === 'rhetorical_risk') {
        const safetyPct = Math.round((1 - d.value) * 100);
        pct = safetyPct;
        valText = `R=${Number(d.value).toFixed(2)}`;
        barColor = d.value >= 0.5 ? 'var(--red)' : (d.value >= 0.3 ? 'var(--yellow)' : 'var(--green)');
      }
      const dimDef = (dict.dim_defs && dict.dim_defs[dKey]) || {};
      const measuresText = dimDef.measures || d.what_it_measures || '';
      const boundaryText = dimDef.boundary || d.what_if_wrong || '';
      const explText = translateExplanation(d.explanation, currentLang) || '—';
      const row = document.createElement('div');
      row.className = 'metric';
      row.innerHTML = `
        <div class="metric-top">
          <span class="metric-name"><span class="icon">${icon}</span> ${titleText}</span>
          <span class="metric-val" style="color:${barColor}">${valText}</span>
        </div>
        <div class="bar"><div class="bar-fill" style="background:${barColor}; width:${pct}%"></div></div>
        <div class="metric-desc"><b>${dt.basis_lbl}</b>${escapeHtml(explText)}</div>
        <div class="metric-desc" style="font-size:11px; color:#94a3b8; margin-top:3px;">
          📏 <b>${dt.def_lbl}</b>${escapeHtml(measuresText)}<br>
          ⚠️ <b>${dt.err_lbl}</b>${escapeHtml(boundaryText)}
        </div>
      `;
      mEl.appendChild(row);
    }
  }

  // 渲染評分計算過程管道 (Calculation Pipeline)
  const pipeWrap = $('scorePipeline');
  const pipeContent = $('scorePipelineContent');
  if (pipeWrap && pipeContent) {
    pipeWrap.style.display = 'block';
    
    // Step 1: 規則維度表格
    let rowsHtml = '';
    let sumRaw = 0;
    let sumW = 0;
    for (const [key, def] of Object.entries(defs)) {
      const m = metrics[key] || { score: 0, desc: '—', weight: def.max };
      const s = Number(m.score || 0);
      const w = Number(m.weight || def.max);
      sumRaw += s;
      sumW += w;
      rowsHtml += `
        <tr>
          <td>${def.icon} ${def.name}</td>
          <td><b>${s > 0 ? '+' + s.toFixed(1) : s.toFixed(1)}</b></td>
          <td>/ ${w}</td>
          <td style="color:var(--text-dim); font-size:11.5px;">${escapeHtml(m.desc || '—')}</td>
        </tr>
      `;
    }
    const ruleScore = data.rule_score != null ? Number(data.rule_score).toFixed(1) : ((sumRaw / sumW) * 100).toFixed(1);
    const aiCs = (data.deep_analysis && data.deep_analysis.credibility_score != null) ? Number(data.deep_analysis.credibility_score).toFixed(1) : null;
    const fusionW = Number(data.fusion_weight || 0);
    const postFusion = Number(data.post_fusion_score != null ? data.post_fusion_score : data.final_score).toFixed(1);
    const finalScore = Number(data.final_score).toFixed(1);

    let html = `
      <div class="pipeline-card">
        <div class="pipeline-step-title">
          <span>${pt.s1_title}</span>
          <span class="pipeline-badge badge-normal">${pt.s1_base}${sumW}</span>
        </div>
        <table class="pipeline-table">
          <thead>
            <tr><th>${pt.th_dim}</th><th>${pt.th_score}</th><th>${pt.th_max}</th><th>${pt.th_detail}</th></tr>
          </thead>
          <tbody>${rowsHtml}</tbody>
        </table>
        <div class="pipeline-formula">
          📐 Rule Score = (${sumRaw.toFixed(1)} ÷ ${sumW}) × 100 = <b>${ruleScore}</b>
        </div>
      </div>
    `;

    // Step 2: AI 動態融合
    if (aiCs !== null) {
      if (fusionW > 0) {
        const ruleWeightPct = ((1 - fusionW) * 100).toFixed(0);
        const aiWeightPct = (fusionW * 100).toFixed(0);
        html += `
          <div class="pipeline-card">
            <div class="pipeline-step-title">
              <span>${pt.s2_title}</span>
              <span class="pipeline-badge badge-normal">${currentLang === 'en' ? 'AI' : 'AI權重'}: ${aiWeightPct}% ｜ ${currentLang === 'en' ? 'Rule' : '規則'}: ${ruleWeightPct}%</span>
            </div>
            <div class="pipeline-formula">
              🧠 (${ruleScore} × ${(1 - fusionW).toFixed(2)}) + (${aiCs} × ${fusionW.toFixed(2)}) = <b>${postFusion}</b>
            </div>
          </div>
        `;
      } else {
        html += `
          <div class="pipeline-card">
            <div class="pipeline-step-title">
              <span>${pt.s2_title}</span>
              <span class="pipeline-badge badge-normal">${pt.s2_pure}</span>
            </div>
            <div class="pipeline-formula">
              🧠 AI: ${aiCs} ➔ <b>${postFusion}</b>
            </div>
          </div>
        `;
      }
    }

    // Step 3: 安全上限錨定 / 最終判定
    html += `
      <div class="pipeline-card">
        <div class="pipeline-step-title">
          <span>${pt.s3_title}</span>
          ${data.clamped ? `<span class="pipeline-badge badge-clamp">${pt.clamped_badge}</span>` : `<span class="pipeline-badge badge-normal">${pt.no_clamp}</span>`}
        </div>
        ${data.clamped ? `<div style="color:#f87171; font-size:12.5px; margin-bottom:6px;">⚠️ ${escapeHtml(data.clamp_reason || '')}</div>` : ''}
        <div class="pipeline-formula">
          🏁 Final Score = <b>${finalScore}</b> ➔ <b>${escapeHtml((dict.ratings && dict.ratings[data.rating_text]) || data.rating_text || '—')}</b>
        </div>
      </div>
    `;

    pipeContent.innerHTML = html;
  }

  // 多源查核來源區塊
  const sourcesWrap = $('sources');
  const sourcesList = $('sourcesList');
  const sources = data.sources || [];
  if (sources.length) {
    sourcesWrap.style.display = 'block';
    sourcesList.innerHTML = '';
    const labelMap = {
      zh: { cofacts: 'Cofacts', google: 'Google 查核', mygopen: 'MyGoPen', rumtoast: '蘭姆酒吐司', hkbu: 'HKBU 查核', infact: 'InFact', jfc: '日本FCセンター', politifact: 'PolitiFact' },
      ja: { cofacts: 'Cofacts (台湾)', google: 'Google ファクトチェック', mygopen: 'MyGoPen (台湾)', rumtoast: 'RumorTruth', hkbu: 'HKBU 検証', infact: 'InFact (日本)', jfc: '日本ファクトチェックセンター', politifact: 'PolitiFact' },
      en: { cofacts: 'Cofacts', google: 'Google Fact-Check', mygopen: 'MyGoPen', rumtoast: 'RumorTruth', hkbu: 'HKBU Fact-Check', infact: 'InFact', jfc: 'Japan FactCheck Center', politifact: 'PolitiFact' }
    }[currentLang] || { cofacts: 'Cofacts', google: 'Google 查核', mygopen: 'MyGoPen', rumtoast: '蘭姆酒吐司', hkbu: 'HKBU 查核', infact: 'InFact', jfc: '日本FCセンター', politifact: 'PolitiFact' };
    const stMap = dict.statuses || {};
    const statusMap = {
      inaccurate: { t: stMap.inaccurate || '不實', c: 'hit' },
      partial:    { t: stMap.partial || '部分正確', c: 'hit' },
      accurate:   { t: stMap.accurate || '屬實', c: 'ok' },
      not_found:  { t: stMap.not_found || '查無', c: '' },
      disabled:   { t: stMap.disabled || '未啟用', c: '' },
      error:      { t: stMap.error || '查詢失敗', c: '' },
    };
    for (const s of sources) {
      const st = statusMap[s.status] || { t: s.status, c: '' };
      const item = document.createElement('div');
      item.className = 'source-item';
      const reasons = (s.reasons || []).map(r => r.text || '').filter(Boolean);
      const reasonHtml = reasons.length ? reasons.join('； ') : (s.note || '');
      const linkHtml = s.url ? `<a class="source-link" href="${s.url}" target="_blank" rel="noopener">${s.url}</a>` : '';
      item.innerHTML = `
        <span class="source-badge ${st.c}">${st.t}</span>
        <div class="source-body">
          <div class="source-name">${labelMap[s.source] || s.source}</div>
          ${reasonHtml ? `<div class="source-reason">${reasonHtml}</div>` : ''}
          ${linkHtml}
        </div>
      `;
      sourcesList.appendChild(item);
    }
  } else {
    sourcesWrap.style.display = 'none';
  }

  // 網路評論搜尋連結區塊
  const reviewWrap = $('reviewLinks');
  const reviewList = $('reviewLinksList');
  const reviewLinks = data.review_links || {};
  const reviewDefs = {
    duckduckgo: { label: 'DuckDuckGo 搜尋', ic: '🦆' },
    threads: { label: 'Threads 搜尋', ic: '🧵' },
    facebook:{ label: 'Facebook 搜尋', ic: '📘' },
  };
  const reviewKeys = Object.keys(reviewLinks).filter(k => reviewLinks[k]);
  if (reviewKeys.length) {
    reviewWrap.style.display = 'block';
    reviewList.innerHTML = '';
    for (const k of reviewKeys) {
      const def = reviewDefs[k] || { label: k, ic: '🔗' };
      const a = document.createElement('a');
      a.className = 'review-btn';
      a.href = reviewLinks[k];
      a.target = '_blank';
      a.rel = 'noopener';
      a.innerHTML = `<span class="ic">${def.ic}</span> ${def.label}`;
      reviewList.appendChild(a);
    }
  } else {
    reviewWrap.style.display = 'none';
  }

  // 真實網路評論/討論搜尋結果（SerpApi / Serper / Google News RSS）
  const webWrap = $('webResults');
  const webList = $('webResultsList');
  const webResults = data.web_results || [];
  if (webResults.length) {
    webWrap.style.display = 'block';
    webList.innerHTML = '';
    for (const r of webResults) {
      const li = document.createElement('li');
      li.className = 'web-result';
      const srcLabel = { serpapi: '🔎 SerpApi', serper: '🔎 Serper', google_news: '📰 Google News', bing: '🌐 Bing' }[r.source] || r.source || '🔗';
      const snip = (r.snippet || '').trim()
        ? `<p class="web-snip">${escapeHtml(r.snippet)}</p>` : '';
      li.innerHTML = `
        <a href="${escapeAttr(r.url)}" target="_blank" rel="noopener" class="web-title">${escapeHtml(r.title)}</a>
        <div class="web-meta"><span class="web-src">${srcLabel}</span><span class="web-url">${escapeHtml(r.url)}</span></div>
        ${snip}`;
      webList.appendChild(li);
    }
  } else {
    webWrap.style.display = 'none';
  }

  // 深入分析（本機 LLM）渲染
  const deepWrap = $('deepAnalysis');
  const da = data.deep_analysis || {};
  if (da && ((da.key_points && da.key_points.length) || da.analysis || da.viewpoints || da.error)) {
    deepWrap.style.display = 'block';
    const score = parseInt(da.credibility_score, 10);
    const scoreValid = !isNaN(score);
    const badge = $('deepScoreBadge');
    const bar = $('deepScoreBar');
    if (scoreValid) {
      if (badge) badge.textContent = score;
      const col = score >= 70 ? 'var(--green)' : score >= 40 ? 'var(--yellow)' : 'var(--red)';
      if (badge) badge.style.color = col;
      if (bar) {
        bar.style.background = col;
        requestAnimationFrame(() => { requestAnimationFrame(() => { if (bar) bar.style.width = score + '%'; }); });
      }
    } else {
      if (badge) badge.textContent = '–';
      if (bar) bar.style.width = '0%';
    }
    // 關鍵質疑點
    const kp = $('deepKeyPoints');
    kp.innerHTML = '';
    (da.key_points || []).forEach(k => {
      const li = document.createElement('li');
      li.textContent = k;
      kp.appendChild(li);
    });
    $('deepViewpoints').textContent = da.viewpoints || '—';
    $('deepAnalysisText').textContent = da.analysis || '—';

    // 2026-10-06：分析失敗時不要留白。原本只靠 key_points/analysis 判斷顯示，
    // 失敗時後端回 {} → 整段消失，使用者只看到「沒有 AI 分析」而不知原因。
    if (!da.analysis && da.error) {
      $('deepAnalysisText').textContent =
        '⚠️ AI 深入分析失敗，本次已跳過 AI 加權（僅採用規則分）：' + da.error;
    }

    // 主張摘要：讓使用者先看到「這次到底在查什麼」，而不是先看到一個分數
    const claimEl = $('deepClaim');
    if (da.claim) {
      claimEl.textContent = (dict.claim_pfx || '查核主張：') + da.claim;
      claimEl.style.display = 'block';
    } else {
      claimEl.style.display = 'none';
    }
    // 暫時分數警示：正文未載入時不得看起來像已完成查核
    const provEl = $('deepProvisional');
    if (da.abstain === true || data.is_provisional) {
      const st = da.evidence_state || data.evidence_state || '';
      const stateTxt = (dict.prov_states && dict.prov_states[st]) || st || '未載入正文';
      provEl.textContent = (dict.prov_warn || '⚠️ 本次為暫時分數，非查核結論｜證據狀態：')
        + stateTxt + (dict.prov_tail || '｜此時不應把分數當成真偽判定');
      provEl.style.display = 'block';
    } else {
      provEl.style.display = 'none';
    }
    // 實際引用來源
    const usedEl = $('deepEvidenceUsed');
    if (Array.isArray(da.evidence_used) && da.evidence_used.length) {
      usedEl.textContent = (dict.evidence_pfx || '引用來源：') + da.evidence_used.join('、');
      usedEl.style.display = 'block';
    } else {
      usedEl.style.display = 'none';
    }
    
    // 判斷是否有進階細節可顯示
    const hasDetails = (da.viewpoints && da.viewpoints !== '—') || (da.analysis && da.analysis !== '—');
    const toggleBtn = $('toggleDeepDetailsBtn');
    const detailsContainer = $('deepDetailsContainer');
    if (hasDetails) {
        toggleBtn.style.display = 'block';
        detailsContainer.style.display = 'block'; // AI 分析回覆預設直接顯示
        toggleBtn.textContent = dict.toggle_deep_hide || '隱藏進階分析細節 ▴';
        
        // 綁定點擊事件（先移除舊的，避免重複綁定）
        toggleBtn.onclick = function() {
            if (detailsContainer.style.display === 'none') {
                detailsContainer.style.display = 'block';
                toggleBtn.textContent = dict.toggle_deep_hide || '隱藏進階分析細節 ▴';
            } else {
                detailsContainer.style.display = 'none';
                toggleBtn.textContent = dict.toggle_deep_btn || '🔍 查看進階分析細節 (AI 觀點與總結) ▾';
            }
        };
    } else {
        toggleBtn.style.display = 'none';
        detailsContainer.style.display = 'none';
    }

    const modelLine = (dict.model_pfx || '模型：') + (da.model || 'local-llm');
    const rs = data.rule_score;
    $('deepModel').textContent = (rs != null ? `${dict.rule_pfx || '規則分 '}${Math.round(rs)} ｜ ` : '') + modelLine;
    // 評分依據說明（為什麼給這個等級）
    const basisEl = $('scoringBasis');
    if (basisEl) {
      let txt = translateExplanation(data.scoring_basis, currentLang) || '';
      if (da.samples && da.score_std != null) {
        txt += ` ｜ ${dict.ai_pfx || 'AI分 '}${da.credibility_score}±${da.score_std}（${da.samples}${dict.sample_sfx || '次取樣'}）`;
      }
      basisEl.textContent = txt;
      basisEl.style.display = txt ? 'block' : 'none';
    }
  } else {
    deepWrap.style.display = 'none';
  }

  // 各步驟耗時（只在 debug 模式後端才回傳，2026-10-05）
  const timingsWrap = $('timingsWrap'), timingsList = $('timingsList');
  const timings = data.timings || {};
  const stepNames = {
    extract: '🔗 網址抓取', sentiment: '😊 情緒分析', fact_check: '✅ 事實查核',
    similarity: '📊 相似度', web_search: '🔍 網路搜尋', deep_analyze: '🧠 AI 深入分析',
    scoring: '🧮 計分融合', total: '🏁 總計',
  };
  const tKeys = Object.keys(stepNames).filter(k => timings[k] != null);
  if (tKeys.length) {
    timingsWrap.style.display = 'block';
    const tMax = Math.max(...tKeys.map(k => Number(timings[k]) || 0), 1);
    let tRows = '<table class="timings-table">';
    for (const k of tKeys) {
      const ms = Number(timings[k]) || 0;
      const txt = ms >= 1000 ? (ms / 1000).toFixed(1) + ' s' : Math.round(ms) + ' ms';
      const pct = Math.max(2, (ms / tMax) * 100);
      tRows += `<tr><td>${stepNames[k]}<div class="timings-bar" style="width:${pct}%"></div></td><td><b>${txt}</b></td></tr>`;
    }
    timingsList.innerHTML = tRows + '</table>';
  } else {
    timingsWrap.style.display = 'none';
  }

  resultCard.classList.add('show');
  resultCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function animateNumber(el, target) {
  const dur = 1000, start = performance.now();
  function tick(now) {
    const t = Math.min(1, (now - start) / dur);
    const eased = 1 - Math.pow(1 - t, 3);
    el.textContent = Math.round(target * eased);
    if (t < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
